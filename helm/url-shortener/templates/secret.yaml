apiVersion: v1
kind: Secret
metadata:
  name: db-secret
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "url-shortener.labels" . | nindent 4 }}
type: Opaque
stringData:
  POSTGRES_PASSWORD: {{ .Values.postgres.password | quote }}
  DATABASE_URL: "postgresql+asyncpg://postgres:{{ .Values.postgres.password }}@postgres-primary:5432/urlshortener"
  DATABASE_READ_URL: "postgresql+asyncpg://postgres:{{ .Values.postgres.password }}@postgres-replica:5432/urlshortener"
