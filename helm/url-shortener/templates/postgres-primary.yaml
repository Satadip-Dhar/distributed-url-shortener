apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "url-shortener.labels" . | nindent 4 }}
data:
  init-primary.sh: |
    #!/bin/bash
    set -e

    psql -v ON_ERROR_STOP=1 --username "$POSTGRES_USER" --dbname "$POSTGRES_DB" <<-EOSQL
        CREATE USER replicator WITH REPLICATION ENCRYPTED PASSWORD 'repl_password';
        SELECT pg_create_physical_replication_slot('replica_slot_1');
    EOSQL

    echo "host replication replicator 0.0.0.0/0 md5" >> "$PGDATA/pg_hba.conf"
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres-primary
  namespace: {{ .Values.namespace }}
  labels:
    app: postgres-primary
spec:
  serviceName: postgres-primary
  replicas: 1
  selector:
    matchLabels:
      app: postgres-primary
  template:
    metadata:
      labels:
        app: postgres-primary
    spec:
      containers:
        - name: postgres
          image: {{ .Values.postgres.image }}
          args:
            - postgres
            - -c
            - wal_level=replica
            - -c
            - max_wal_senders=3
            - -c
            - max_replication_slots=3
            - -c
            - hot_standby=on
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: urlshortener
            - name: POSTGRES_USER
              value: postgres
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-secret
                  key: POSTGRES_PASSWORD
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: init
              mountPath: /docker-entrypoint-initdb.d
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres"]
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres"]
            initialDelaySeconds: 15
            periodSeconds: 20
      volumes:
        - name: init
          configMap:
            name: postgres-init
            defaultMode: 0755
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: {{ .Values.postgres.primary.storage }}
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-primary
  namespace: {{ .Values.namespace }}
  labels:
    app: postgres-primary
spec:
  selector:
    app: postgres-primary
  ports:
    - port: 5432
      targetPort: 5432
