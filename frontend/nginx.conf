upstream backend {
    server backend:8000;
}

server {
    listen 3000;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # API routes → FastAPI backend.
    # Makes port 3000 a self-contained app (the SPA posts to same-origin /api),
    # and lets the Kubernetes Ingress send /api straight to the backend.
    location /api/ {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Short code redirects → FastAPI backend.
    # Required on Kubernetes: the Ingress routes everything except /api here,
    # and this proxy hands single-segment codes to the backend.
    # (Regex is quoted because it contains { and }.)
    location ~ "^/([a-zA-Z0-9]{1,10})$" {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Health / metrics passthrough (parity with the compose edge).
    # Note: the quoted regex above would match these single-segment paths too.
    location /health {
        proxy_pass http://backend;
    }

    location /metrics {
        proxy_pass http://backend;
    }

    # Static React build with SPA fallback.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
